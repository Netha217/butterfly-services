
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services Touristiques</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        header {
            background-color: #007BFF;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #0056b3;
            padding: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        .gallery img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .contact-form {
            background-color: white;
            padding: 20px;
            max-width: 600px;
            margin: 20px auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .contact-form h2 {
            text-align: center;
            color: #007BFF;
        }
        .contact-form input, .contact-form textarea, .contact-form button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .contact-form button {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        .contact-form button:hover {
            background-color: #0056b3;
        }
        footer {
            text-align: center;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bienvenue sur Butterfly Service</h1>
        <p>Explorez les merveilles d'Abidjan et de la Côte d'Ivoire avec nous !</p>
    </header>
    <nav>
        <a href="#gallery">Galerie</a>
        <a href="#contact">Contact</a>
    </nav>
    <section id="gallery" class="gallery">
        <img src="https://via.placeholder.com/300" alt="Lieu touristique 1">
        <img src="https://via.placeholder.com/300" alt="Lieu touristique 2">
        <img src="https://via.placeholder.com/300" alt="Lieu touristique 3">
        <img src="https://via.placeholder.com/300" alt="Lieu touristique 4">
    </section>
    <section id="contact" class="contact-form">
        <h2>Contactez-nous</h2>
        <form action="#" method="post">
            <input type="text" name="name" placeholder="Votre nom" required>
            <input type="email" name="email" placeholder="Votre email" required>
            <textarea name="message" rows="5" placeholder="Votre message"></textarea>
            <button type="submit">Envoyer</button>
        </form>
    </section>
    <footer>
        &copy; 2025 Butterfly Service. Tous droits réservés.
    </footer>
</body>
</html>
